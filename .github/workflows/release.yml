name: Release

# Release flow, automated. A dev -> main PR merge (a push to main) is the release
# trigger: read metadata.version from marketplace.json, and if that tag doesn't already
# exist, build the .skill assets and publish the GitHub Release. Pushes to main that
# don't bump the version are no-ops (tag already exists). No manual `gh release` needed.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# READ BY DEFAULT; WRITE ONLY WHERE THE RELEASE IS CREATED (#1178). A workflow-level `write` is
# inherited by every job, including the gate sweep, which runs every script in the repository.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # THE PUBLISH IS GATED. `main` is the install surface -- `/plugin marketplace add` resolves the
  # default branch -- so a push here IS the deploy, and it must not happen on unproven content.
  #
  # The promotion PR runs the sweep too, but that is not sufficient and the reason is the same one
  # gates.yml already gives for watching `dev`: a merge commit is content no PR run ever tested. A
  # clean merge of two clean branches can still break a gate that reads across both, and here the
  # blast radius of that is a published release.
  #
  # REUSE A PROVEN SWEEP, NEVER ASSUME ONE (#1635). A push to dev now runs only the fast sweep, and the
  # full one (with `mutation coverage`) runs on the maintainer's machine before a promotion, where
  # `maintainer_doctor.py --gates-only --require-slow --record-proof` posts a `full-sweep` commit status
  # whose description names the TREE it ran on. This job looks for such a status on a dev commit with the
  # SAME tree as the commit being released (a tree is a hash of the content, so equal trees are the same
  # bytes even though the promotion is a new merge commit). Found: `gates` below is skipped and the log names
  # the commit that carries the proof. Not found, or any error looking: the full sweep runs, as it always did.
  proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      found: ${{ steps.verify.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Look for a full sweep recorded against this tree
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 scripts/sweep_proof.py verify; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

  gates:
    needs: proof
    if: needs.proof.outputs.found != 'true'
    uses: ./.github/workflows/gates.yml

  release:
    needs: [proof, gates]
    # Releases only ever come from main. workflow_dispatch stays available for re-runs,
    # but a dispatch from any other ref must NOT publish a release for that ref's commit.
    # `gates` is SKIPPED, not green, exactly when `proof` found a recorded sweep for this tree; a skipped
    # `gates` with no proof (which the `gates` condition cannot produce) would not publish.
    if: >-
      github.ref == 'refs/heads/main' && !cancelled() &&
      (needs.gates.result == 'success' ||
       (needs.gates.result == 'skipped' && needs.proof.outputs.found == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write   # `gh release create` makes the tag and the release
      issues: write     # the shipped note on each issue this release carries (close_on_dev_merge.py)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # `gh release create` authenticates with GH_TOKEN, not git, so nothing needs the persisted
          # credential (#1178).
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Resolve version from marketplace.json
        id: v
        run: |
          version="$(python -c "import json;print(json.load(open('.claude-plugin/marketplace.json'))['metadata']['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: v$version"

      - name: Skip if the release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.v.outputs.tag }} already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .skill assets (deterministic, canonical builder)
        if: steps.check.outputs.exists == 'false'
        run: python scripts/package_core.py

      - name: Verify committed dist is canonical (no drift)
        if: steps.check.outputs.exists == 'false'
        run: |
          # --porcelain catches tracked modifications AND untracked files, so a brand-new
          # skill whose dist/*.skill was never committed also trips the guard (git diff
          # --quiet would miss the untracked artifact and pass falsely).
          drift="$(git status --porcelain -- dist/)"
          if [ -n "$drift" ]; then
            echo "::error::Committed dist/*.skill differs from a clean package_core.py build (or a built artifact is untracked)."
            echo "A skill source changed without repackaging, or a new skill's dist/ was not committed. Run 'python scripts/package_core.py' and commit dist/."
            printf '%s\n' "$drift"
            exit 1
          fi
          echo "dist/ matches a clean build."

      - name: Extract release notes from CHANGELOG
        if: steps.check.outputs.exists == 'false'
        id: notes
        run: |
          notes="$(mktemp)"
          # EVERY `### … (release vX.Y.Z)` block, not just the first (#699). The awk that used to
          # live here `exit`ed at the next heading, so a promotion bumping two components published
          # one component's notes and silently dropped the other's — four releases shipped that way.
          # The extractor lives in ONE script called from here and from release_local.sh, because it
          # was duplicated verbatim in both and a comment asking maintainers to keep them in step is
          # the same unenforced claim as the bug. lint_self_consistency fails if either grows its own.
          # FAIL CLOSED before extracting (#990): every block written for this tag publishes, every
          # heading in the file is in order and names a real tag, and no `### Unreleased` rides along.
          python scripts/extract_release_notes.py --check --all-tags --promotion --tag "${{ steps.v.outputs.tag }}"
          python scripts/extract_release_notes.py --tag "${{ steps.v.outputs.tag }}" > "$notes"
          printf '\nInstall: /plugin marketplace add %s\n' "$GITHUB_REPOSITORY" >> "$notes"
          echo "file=$notes" >> "$GITHUB_OUTPUT"
          echo "--- notes ---"; cat "$notes"

      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            dist/*.skill \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.v.outputs.tag }}" \
            --notes-file "${{ steps.notes.outputs.file }}"
          echo "Published ${{ steps.v.outputs.tag }}."

      - name: Tell each issue this release ships that it is installable
        # AFTER the publish, so an issue never reads "shipped" for a release that failed. Issues were
        # closed at their dev merge with label `fixed-on-dev`; this names the version and drops it.
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/close_on_dev_merge.py --shipped "${{ steps.v.outputs.tag }}" --notes "${{ steps.notes.outputs.file }}"
