name: publish wiki

# Mirrors docs/wiki/ into the GitHub wiki whenever a push to main changes it.
#
# WHY THE SOURCE LIVES IN THE REPO. A GitHub wiki is a separate git repository: no pull request, no
# review, and no gate can reach it. Authoring there means a renamed command silently makes the wiki
# wrong -- which is exactly how the README came to name version 1.3.1 while the marketplace shipped
# 1.80.0. Here the reference pages are generated by scripts/build_wiki.py and drift-gated, so the
# same PR that renames a command also fixes its documentation or fails.
#
# WHY IT SKIPS RATHER THAN FAILS when the wiki is uninitialised. GitHub does not create the
# `.wiki.git` repository until the first page is saved in the web UI, and no API call can do it.
# Publishing docs is advisory: a release must not go red because a mirror target does not exist yet.
# It says so loudly instead of exiting 0 in silence, which would be indistinguishable from success.
# A push that FAILS for any other reason is a real failure and is not swallowed.

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false      # two mirrors racing would interleave commits

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the pages are a clean build before mirroring
        run: |
          set -euo pipefail
          python3 scripts/build_wiki.py --check
        # Mirroring a stale reference is worse than not mirroring: it publishes a wrong command
        # list under the repository's name. The drift gate already runs on every PR; this is the
        # last chance to catch a page that reached main without being rebuilt.

      - name: Mirror docs/wiki into the wiki repository
        env:
          WIKI: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: |
          set -euo pipefail
          if ! git ls-remote "$WIKI" >/dev/null 2>&1; then
            echo "::warning::The wiki repository does not exist yet."
            echo "GitHub creates it only after the first page is saved in the web UI:"
            echo "  https://github.com/${{ github.repository }}/wiki  ->  Create the first page"
            echo "Save any page there once, then re-run this workflow. Nothing else is needed."
            exit 0
          fi

          git clone --depth 1 "$WIKI" wiki
          # Replace tracked content wholesale so a DELETED page disappears from the wiki too. A
          # mirror that only ever adds leaves removed pages live and linkable, which is the more
          # confusing failure -- a reader finds a page the repository no longer believes in.
          find wiki -maxdepth 1 -name '*.md' -delete
          cp docs/wiki/*.md wiki/

          cd wiki
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already matches docs/wiki — nothing to publish."
            exit 0
          fi
          git commit -m "docs: mirror docs/wiki from ${{ github.sha }}"
          git push
          echo "published $(ls *.md | wc -l) page(s) to the wiki."
