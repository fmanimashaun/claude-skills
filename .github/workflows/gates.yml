name: Gates

# WHY THIS EXISTS. Until now, every automated check on a pull request in this repo belonged to a
# THIRD PARTY -- AccessLint and GitGuardian. Our own workflow was `release.yml`, which fires only on
# a push to `main`, after merge, and whose single check is the `dist/` drift guard. So the gates (35
# at the time) this repo builds, documents at length, and treats as its safety net ran **nowhere automatically**:
# they ran when a maintainer remembered to type `maintainer_doctor --gates`.
#
# That is the claims-vs-enforcement defect the repo warns about most, sitting in its own
# infrastructure. CLAUDE.md insists guarantees belong in the deterministic layer; the deterministic
# layer was a command a human had to remember.
#
# Actions is free and unmetered for public repositories, so there was never a cost reason either.

on:
  pull_request:
  # `dev` too, not only PRs: a maintainer merging their own PR is the normal path here, and the
  # merge COMMIT is content no PR run ever tested -- a clean merge of two clean branches can still
  # break a gate that reads across both.
  push:
    branches: [dev]
  # Callable, so `release.yml` runs THIS definition rather than a second copy. One sweep, one place:
  # two copies would drift, and the copy that drifted would be the one guarding production.
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags too (#834). The `release notes complete` gate asserts every `(release vX)` heading names
          # a real tag; a depth-1 checkout has no tags and reported 144 ghosts. release.yml already fetches
          # the full history for the same reason -- change one, change the other.
          fetch-depth: 0
          # No step here pushes with git, so the token is not left in .git/config for later steps (#1178).
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # `lint_markdown_code.py` shells out to `node --check` and `ruby -c`. Both are preinstalled on
      # ubuntu-latest, and this step FAILS rather than skipping if either is missing: that linter
      # reports exit 3 (INCOMPLETE) when an interpreter is absent, the doctor maps 3 to SKIP, and a
      # skip in CI is indistinguishable from a pass unless something asserts the interpreters exist.
      - name: Interpreters the gates shell out to
        run: |
          set -euo pipefail
          for bin in node ruby; do
            command -v "$bin" >/dev/null || { echo "::error::$bin is not on PATH — the markdown code linter would report INCOMPLETE and its findings would be silently skipped."; exit 1; }
            echo "$bin: $("$bin" --version)"
          done

      # The gate sweep WITHOUT the machine diagnostics. Those ask about a maintainer's clone --
      # current branch, stale local `main` ref, `gh` auth, the licensed corpora -- none of which is
      # meaningful on a runner, and failing on them would teach people to ignore a red build.
      #
      # The corpora-dependent gate SKIPs by design when the private repo is absent, which is exactly
      # a runner's situation. That was built for a maintainer without the kits; CI inherits it free.
      # A pull request runs --fast, which skips exactly PR_SKIPPED_GATES (`mutation coverage`, 438 of the
      # sweep's 475 s) and REPORTS the skip. A push to dev -- the merge commit no PR tested -- and the
      # promotion (release.yml calls this workflow) run everything, so nothing reaches main without it (#866).
      - name: Gate sweep
        run: python3 scripts/maintainer_doctor.py --gates-only ${{ github.event_name == 'pull_request' && '--fast' || '' }}

      # The PROMOTION pre-flight (#990): a pull request whose base is `main` is the one merge that
      # publishes, so it is the one place `### Unreleased` must not survive. The v1.127.0 promotion
      # carried a qa-flow Unreleased block onto main -- shipped, unversioned, notes never published --
      # against a rule CLAUDE.md stated and nothing enforced. `--promotion` is NOT in the doctor's
      # sweep on purpose: on dev, Unreleased is the normal state between promotions.
      # The `if` below is the intent. It is NOT trusted on its own, because it has been observed
      # to be wrong (#1092): on 2026-09-21 this step RAN on a pull request whose base was `dev`,
      # four times, and was correctly skipped on sibling PRs minutes apart. Every hypothesis was
      # tested and refuted -- a stale workflow file (byte-identical on both refs, and the `if` has
      # been there since b4adaa7), an open `dev -> main` PR (closed at 12:25:58; the run is
      # 12:28:09), a stale rerun context (a fresh close/reopen reproduced it), two colliding runs
      # (they were Gates and CodeQL), and a merge commit on the branch (probed deliberately in
      # #1101: skipped).
      #
      # A PR into `dev` is REQUIRED to carry `### Unreleased`, so a misfire here is a gate that is
      # red on correct code -- and the response it trains is the dangerous one: strip the
      # Unreleased block, which is exactly what #990 added this step to prevent.
      #
      # So the step now establishes its own precondition instead of trusting the context, and
      # prints what it saw. If the `if` ever misfires again the run says so in one line, and the
      # check no-ops rather than failing a correct branch.
      - name: Promotion carries no Unreleased heading
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        # THROUGH `env:`, NEVER `${{ }}` INSIDE `run:` (#1178). `head_ref` is the PR's source branch
        # name, chosen by whoever opens it -- a fork included -- and git ref names may contain `"`,
        # `;` and `$`. Expanded into the script it is code; read from the environment it is data.
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "context: event=$EVENT_NAME base_ref=$BASE_REF head_ref=$HEAD_REF"
          base="$(gh pr view "$PR_NUMBER" --json baseRefName --jq .baseRefName)"
          echo "resolved base of PR #${{ github.event.pull_request.number }}: ${base}"
          if [ "$base" != "main" ]; then
            echo "NOT a promotion (base is '${base}', not 'main') — the promotion-only check does"
            echo "not apply. On dev, an Unreleased heading is the required state. See #1092."
            exit 0
          fi
          python3 scripts/extract_release_notes.py --check --all-tags --promotion

      # `dist/` drift is a DIAGNOSTIC rather than a gate, so `--gates-only` does not cover it. It is
      # checked here too because release.yml checks it only at release time, on `main`, AFTER merge
      # -- which means a PR that changed a skill without repackaging would go green here and break
      # the release later, on someone else's clock. Same shape as release.yml's step on purpose: if
      # you change one, change the other.
      - name: Committed dist/ is a clean build
        run: |
          set -euo pipefail
          python3 scripts/package_core.py
          # --porcelain catches tracked modifications AND untracked files, so a brand-new skill whose
          # dist/*.skill was never committed also trips this (git diff --quiet would miss it).
          drift="$(git status --porcelain -- dist/)"
          if [ -n "$drift" ]; then
            echo "::error::Committed dist/*.skill differs from a clean package_core.py build (or a built artifact is untracked)."
            echo "Run 'python3 scripts/package_core.py' and commit dist/."
            printf '%s\n' "$drift"
            exit 1
          fi
          echo "dist/ matches a clean build."
